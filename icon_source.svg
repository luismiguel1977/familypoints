<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset=".55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="coinshine" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#FFE79A"/>
      <stop offset=".55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD35C"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#93C5FD" stop-opacity=".55"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- destellos -->
  <g fill="#FFFFFF">
    <path d="M96 176 l6 18 18 6 -18 6 -6 18 -6-18 -18-6 18-6z" opacity=".9"/>
    <path d="M416 150 l7 22 22 7 -22 7 -7 22 -7-22 -22-7 22-7z" opacity=".7"/>
    <path d="M120 396 l5 15 15 5 -15 5 -5 15 -5-15 -15-5 15-5z" opacity=".6"/>
    <path d="M400 408 l6 17 17 6 -17 6 -6 17 -6-17 -17-6 17-6z" opacity=".75"/>
  </g>

  <!-- corona (sobre la moneda) -->
  <g>
    <path d="M170 176 L170 148 L200 92 L226 148 L256 74 L286 148 L312 92 L342 148 L342 176 Z" fill="url(#crown)" stroke="#B45309" stroke-width="7" stroke-linejoin="round"/>
    <rect x="170" y="158" width="172" height="30" rx="10" fill="url(#crown)" stroke="#B45309" stroke-width="6"/>
    <circle cx="204" cy="88" r="11" fill="#FFE08A" stroke="#B45309" stroke-width="5"/>
    <circle cx="256" cy="70" r="11" fill="#FFE08A" stroke="#B45309" stroke-width="5"/>
    <circle cx="308" cy="88" r="11" fill="#FFE08A" stroke="#B45309" stroke-width="5"/>
    <circle cx="216" cy="173" r="9" fill="#EF4444" stroke="#7F1D1D" stroke-width="2"/>
    <circle cx="256" cy="173" r="9" fill="#3B82F6" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="296" cy="173" r="9" fill="#22C55E" stroke="#14532D" stroke-width="2"/>
  </g>

  <!-- moneda -->
  <circle cx="256" cy="308" r="150" fill="#B45309"/>
  <circle cx="256" cy="302" r="150" fill="url(#coinshine)"/>
  <circle cx="256" cy="302" r="128" fill="none" stroke="#B45309" stroke-width="5" opacity=".35"/>
  <circle cx="256" cy="302" r="112" fill="none" stroke="#FDE68A" stroke-width="3" opacity=".6"/>
  <ellipse cx="196" cy="246" rx="70" ry="42" fill="#FFFFFF" opacity=".22"/>

  <!-- estrella central (puntos) -->
  <path d="M256 244 L270.1 282.6 L310.2 284.1 L277.8 309.4 L289.1 348.9 L256 326 L220.9 348.9 L232.2 309.4 L199.8 284.1 L241.9 282.6 Z" fill="#FFFFFF" stroke="#EAB308" stroke-width="4" stroke-linejoin="round"/>
</svg>
